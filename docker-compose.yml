# Local development services. Production uses managed Postgres/Redis and Cloudflare R2.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: photnoo
      POSTGRES_PASSWORD: photnoo
      POSTGRES_DB: photnoo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photnoo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # S3-compatible stand-in for Cloudflare R2
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: photnoo
      MINIO_ROOT_PASSWORD: photnoo-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3;
      mc alias set local http://minio:9000 photnoo photnoo-secret;
      mc mb -p local/photnoo-media;
      exit 0;"

  # Catches outgoing email; UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  miniodata:
